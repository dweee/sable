# Generated by dave-fork-ci/ci/install-channel-automation.py
name: Input and manual version monitoring
'on':
  schedule:
  - cron: 15 1,7,13,19 * * *
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: scheduled-input-updates
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: nix-light
    timeout-minutes: 120
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = false
        sandbox = false
        filter-syscalls = false
        extra-experimental-features = parallel-eval
        eval-cores = 2
      NIX_REMOTE: daemon
    container:
      image: sha256:7c3a57c9ca61aab9d1c743f1af773f3cd65e3c68a0ae447e2cca6d4838de5b0a
    if: ${{ (github.ref == 'refs/heads/main' || (github.event_name == 'schedule' && github.ref == 'main')) }}
    steps:
    - name: Checkout exact source without a Node dependency
      env:
        TOKEN: ${{ github.token }}
        SERVER: ${{ github.server_url }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        set -eu
        auth=$(printf "x-access-token:%s" "$TOKEN" | base64 | tr -d "\n")
        git init -q .
        git remote add origin "$SERVER/$REPO.git"
        git -c http.extraHeader="Authorization: Basic $auth" fetch -q origin "$SHA"
        git checkout -q --detach FETCH_HEAD
    - name: Start isolated Determinate daemon
      run: |-
        set -eu
        nix --version | grep -F 'Determinate Nix 3.24.1'
        env -u NIX_REMOTE nix-daemon > /tmp/nix-daemon.log 2>&1 &
        daemon=$!
        for n in $(seq 1 30); do [ -S /nix/var/nix/daemon-socket/socket ] && break; kill -0 $daemon; sleep 1; done
        test -S /nix/var/nix/daemon-socket/socket
        test "$(readlink -f /proc/$daemon/exe)" = "$(readlink -f "$(command -v nix)")"
        nix store info --store daemon --json
        printf 'NIX_REMOTE=daemon\n' >> "$GITHUB_ENV"
    - name: Monitor manual package/file pins
      id: monitor
      env:
        GH_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        MONITOR_TOKEN: ${{ github.token }}
      run: nix shell --option accept-flake-config false --no-write-lock-file --inputs-from . nixpkgs#python3 -c
        python3 ci/update-monitor.py
    - name: Maintain one version monitoring issue
      if: ${{ always() }}
      env:
        AUTOMATION_TOKEN: ${{ secrets.UPDATE_TOKEN || github.token }}
      run: nix shell --option accept-flake-config false --no-write-lock-file --inputs-from . nixpkgs#python3 -c
        python3 ci/automation-forge.py report
  inputs:
    runs-on: nix-light
