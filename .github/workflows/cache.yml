name: Niks3 cache
# Publishes the Sable outputs the fleet installs to the private Niks3 cache.
# There is no pull_request trigger: the OIDC write grant only ever reaches a
# default-branch push or a manual dispatch. See ci/CACHE.md.
'on':
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and describe the outputs, upload nothing
        type: boolean
        default: true
      packages:
        description: Space-separated package attributes (default is what the fleet installs)
        type: string
        default: sable sable-web
permissions:
  contents: read
concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Publisher checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run the credential-free publisher tests
        run: |
          python3 ci/test-push-niks3.py
          python3 ci/test-cache-plan.py
  publish:
    permissions:
      contents: read
      id-token: write
    name: Cache ${{ matrix.system }}
    needs: check
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.repository == 'dweee/sable' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The systems the private fleet installs Sable on. Nothing there uses
        # Intel macOS, so that system is checked by nix.yml but not uploaded.
        include:
          - { system: x86_64-linux, runner: ubuntu-24.04 }
          - { system: aarch64-linux, runner: ubuntu-24.04-arm }
          - { system: aarch64-darwin, runner: macos-15 }
    env:
      # Upload only after the owner enables it, and never from a dry-run dispatch.
      PUBLISH: ${{ vars.NIKS3_PUSH_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
      PACKAGES: ${{ inputs.packages || 'sable sable-web' }}
      SYSTEM: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = false
      - name: Build the fleet outputs from the committed flake.lock
        run: python3 ci/cache-plan.py --system "$SYSTEM" --packages "$PACKAGES" --directory "$RUNNER_TEMP/cache"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cache-manifest-${{ matrix.system }}
          path: ${{ runner.temp }}/cache/manifest.json
          retention-days: 30
          if-no-files-found: error
      - name: Install pinned Niks3 publisher
        run: bash ci/install-niks3.sh
      - name: Publish to Niks3 with GitHub OIDC and verify S3 integrity
        if: ${{ env.PUBLISH == 'true' }}
        run: python3 ci/push-niks3.py --outputs "$RUNNER_TEMP/cache/outputs.txt"
