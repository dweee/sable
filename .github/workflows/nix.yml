name: Nix packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher-tests:
    name: Attic publisher tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run the credential-free publisher tests
        run: |
          python3 ci/test-push-attic.py
          python3 ci/test-attic-plan.py
  packages:
    name: Nix ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: x86_64-linux, runner: ubuntu-24.04}
          - {system: aarch64-linux, runner: ubuntu-24.04-arm}
          - {system: x86_64-darwin, runner: macos-15-intel}
          - {system: aarch64-darwin, runner: macos-15}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3
        if: matrix.system != 'x86_64-darwin'
        with:
          source-tag: v3.24.1
          summarize: false
          kvm: false
          extra-conf: |
            experimental-features = nix-command flakes parallel-eval
            eval-cores = 2
      # Determinate Nix 3.24.1 does not support Intel macOS hosts. Keep the
      # native Intel build check rather than silently testing a different host.
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012
        if: matrix.system == 'x86_64-darwin'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Nix client and daemon
        if: matrix.system != 'x86_64-darwin'
        run: |
          set -euo pipefail
          nix --version | grep -F 'Determinate Nix 3.24.1'
          nix store info --store daemon --json
      - name: Build and check packages and every downloadable platform artifact
        run: nix flake check --no-update-lock-file -L
      - name: Evaluate development shells
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          nix eval --raw ".#devShells.$SYSTEM.default.drvPath"
          nix eval --raw ".#devShells.$SYSTEM.android.drvPath"
          if [[ "$SYSTEM" == *-darwin ]]; then nix eval --raw ".#devShells.$SYSTEM.ios.drvPath"; fi
