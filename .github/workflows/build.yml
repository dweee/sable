name: Build every supported platform
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify (pushes always build everything)
        type: choice
        default: all
        options: [all, desktop, android, ios]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  # Fetch the locked SDK through its verified job-local Git mirror.
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  # Keep the v2 identity. Never invoke prepare-v1-release.mjs in this fork.
  SABLE_BUILD_FLAVOR: fork
  SABLE_DISABLE_UPDATER: '1'
  VITE_SABLE_DISABLE_UPDATER: '1'
jobs:
  web:
    name: Web and WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          build: 'true'
      - name: Check update isolation
        run: |
          pnpm exec vitest run src/lib/platform/updates.test.ts electron/src/updater.test.ts
          node --test scripts/build/electron-fork-identity.test.mjs
      - name: Archive web bundle
        run: tar -czf sable-web.tar.gz -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-assets
          path: |
            dist
            .svelte-kit/output
            src/generated/wasm
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-web
          path: sable-web.tar.gz
          if-no-files-found: error
  desktop:
    name: ${{ matrix.name }}
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'desktop'
    needs: web
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 Electron
            runner: ubuntu-24.04
            platform: linux-x86_64
            electron-platform: linux
            electron-arch: x64
          - name: Linux aarch64 Electron
            runner: ubuntu-24.04-arm
            platform: linux-aarch64
            electron-platform: linux
            electron-arch: arm64
          - name: macOS Apple Silicon Electron
            runner: macos-15
            platform: macos-aarch64
            electron-platform: mac
            electron-arch: arm64
          - name: macOS Intel Electron
            runner: macos-15-intel
            platform: macos-x86_64
            electron-platform: mac
            electron-arch: x64
          - name: Windows x86_64 Electron
            runner: windows-2025
            platform: windows-x86_64
            electron-platform: win
            electron-arch: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-assets
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libclang-dev libpipewire-0.3-dev pkg-config rpm
          asound=$(apt-cache show libasound2t64 >/dev/null 2>&1 && echo libasound2t64 || echo libasound2)
          sudo apt-get install --no-install-recommends -y libnss3 libgtk-3-0 libgbm1 "$asound"
      - uses: ./.github/actions/setup
        with:
          rust: 'true'
          rust-cache-key: ${{ matrix.platform }}
          install-mise-tools: 'false'
      - name: Build native Electron distribution
        env:
          ELECTRON_PLATFORM: ${{ matrix.electron-platform }}
          ELECTRON_ARCH: ${{ matrix.electron-arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm --dir electron package "--$ELECTRON_PLATFORM" "--$ELECTRON_ARCH"
          mkdir -p artifacts
          count=0
          for artifact in electron/release/*; do
            test -f "$artifact" || continue
            case "$artifact" in
              *.deb|*.rpm|*.AppImage|*.tar.gz|*.dmg|*.zip|*.exe|*.msi)
                cp -- "$artifact" artifacts/
                count=$((count + 1))
                ;;
            esac
          done
          test "$count" -gt 0
      - name: Verify macOS fork bundle identity
        if: runner.os == 'macOS'
        run: |
          plist=$(find electron/release -maxdepth 4 -path '*.app/Contents/Info.plist' -type f -print -quit)
          test -n "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = moe.sable.next
      - name: Verify native core shutdown
        run: |
          SABLE_NODE_ADDON="$PWD/electron/dist/sable_node.node" node --test crates/sable-node/tests/native-lifecycle.mjs
          ELECTRON_RUN_AS_NODE=1 SABLE_NODE_ADDON="$PWD/electron/dist/sable_node.node" pnpm --dir electron exec electron --test "$PWD/crates/sable-node/tests/native-lifecycle.mjs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
  android:
    name: Android arm64 and armv7
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MISE_ENV: tauri
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-assets
      - uses: ./.github/actions/setup
        with:
          rust: 'true'
          rust-cache-key: android
          install-mise-tools: 'false'
      - name: Provision Android SDK and Rust targets
        run: |
          mise run tauri:setup:android
          sdk=$(mise exec -- printenv ANDROID_HOME)
          java=$(mise exec -- printenv JAVA_HOME)
          test -d "$sdk/ndk/29.0.14206865"
          {
            printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk"
            printf 'NDK_HOME=%s/ndk/29.0.14206865\nANDROID_NDK_HOME=%s/ndk/29.0.14206865\n' "$sdk" "$sdk"
            printf 'JAVA_HOME=%s\n' "$java"
          } >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi
          printf '\norg.gradle.workers.max=2\norg.gradle.jvmargs=-Xmx3g\n' >> src-tauri/gen/android/gradle.properties
      - name: Build FOSS APKs for both ABIs
        env:
          SABLE_FOSS: '1'
        run: |
          mv src-tauri/capabilities/geolocation.json "$RUNNER_TEMP/geolocation.json"
          pnpm tauri android build --config src-tauri/tauri.ci.conf.json --apk --split-per-abi --target aarch64 armv7 -- --no-default-features
          mv "$RUNNER_TEMP/geolocation.json" src-tauri/capabilities/geolocation.json
          mkdir -p artifacts
          for pair in arm64:aarch64 arm:armv7; do
            flavor=${pair%:*}; abi=${pair#*:}
            apk=$(find "src-tauri/gen/android/app/build/outputs/apk/$flavor/release" -name '*.apk' -print -quit)
            test -n "$apk"
            "$ANDROID_HOME/build-tools/$(mise exec -- printenv ANDROID_BUILD_TOOLS_VERSION)/aapt2" dump badging "$apk" | grep -q "^package: name='moe.sable.next'"
            cp "$apk" "artifacts/sable-android-$abi-foss-unsigned.apk"
          done
      - name: Build universal APK and Android App Bundle
        run: |
          pnpm tauri android build --config src-tauri/tauri.ci.conf.json --apk --aab --target aarch64 armv7
          apk=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -name '*.apk' -print -quit)
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle/universalRelease -name '*.aab' -print -quit)
          test -n "$apk" && test -n "$aab"
          "$ANDROID_HOME/build-tools/$(mise exec -- printenv ANDROID_BUILD_TOOLS_VERSION)/aapt2" dump badging "$apk" | grep -q "^package: name='moe.sable.next'"
          cp "$apk" artifacts/sable-android-universal-unsigned.apk
          cp "$aab" artifacts/sable-android-universal-unsigned.aab
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-android
          path: artifacts/*
          if-no-files-found: error
  ios:
    name: iOS arm64 (unsigned)
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    needs: web
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # macos-15 defaults to Xcode 16.4, whose SDK predates LiveKit's APIs.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-assets
      - uses: ./.github/actions/setup
        with:
          rust: 'true'
          rust-cache-key: ios-xcode-26.3
          persist-cargo-sdk-config: 'true'
          install-mise-tools: 'false'
      - name: Verify Cargo resolution across the sanitized Xcode boundary
        run: |
          node --test scripts/ci/prepare-cargo-sdk.test.mjs
          python3 scripts/ci/test-verify-ios-ipa.py
      - name: Provision iOS project
        run: |
          # Tauri's mobile tooling also consults the system xcode-select path.
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${sdk%%.*}" -ge 26
          system_sdk=$(env -u DEVELOPER_DIR xcrun --sdk iphoneos --show-sdk-version)
          test "${system_sdk%%.*}" -ge 26
          command -v pod >/dev/null || brew install cocoapods
          pnpm tauri ios init --ci --config '{"identifier":"moe.sable.next"}'
          pnpm ios:frameworks
          rustup target add aarch64-apple-ios
      - name: Build unsigned IPA
        run: |
          pnpm tauri ios build --config src-tauri/tauri.ci.conf.json --config '{"identifier":"moe.sable.next"}' --no-sign --ci
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' -type f -print -quit)
          test -n "$ipa"
          python3 scripts/ci/verify-ios-ipa.py "$ipa" moe.sable.next
          mkdir -p artifacts
          cp "$ipa" artifacts/sable-ios-arm64-unsigned.ipa
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-ios
          path: artifacts/*
          if-no-files-found: error
  # Stable, always-running aggregate: the required status check for this repository.
  test:
    name: test
    if: ${{ always() }}
    needs: [web, desktop, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform job to have passed or been skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  release:
    name: Publish complete platform set
    needs: [web, desktop, android, ios]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Verify the release tag exists in canonical Forgejo
        run: node scripts/ci/verify-forgejo-release-tag.mjs https://git.monke.fail/d/sable "$GITHUB_REF_NAME" "$(git rev-parse HEAD)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Publish checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          # GitHub replaces spaces in uploaded asset names with dots.
          for artifact in ./*; do
            name=${artifact##*/}
            normalized=${name// /.}
            if [ "$name" != "$normalized" ]; then
              test ! -e "./$normalized"
              mv -- "$artifact" "./$normalized"
            fi
          done
          sha256sum ./* > SHA256SUMS
          tag="$GITHUB_REF_NAME"
          prerelease=()
          if [[ "$tag" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" ./* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" ./* --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "Sable v2 $tag" --notes 'All supported platform builds passed. Android and iOS source artifacts are unsigned; re-sign before installing. This fork keeps a separate v2 application identity.' "${prerelease[@]}"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '.assets[] | select(.name != "SHA256SUMS") | "\(.digest | sub("^sha256:"; ""))  \(.name)"' \
            | LC_ALL=C sort > "$RUNNER_TEMP/published-sha256"
          sed 's@  \./@  @' SHA256SUMS | LC_ALL=C sort > "$RUNNER_TEMP/expected-sha256"
          diff -u "$RUNNER_TEMP/expected-sha256" "$RUNNER_TEMP/published-sha256"
          published_manifest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '.assets[] | select(.name == "SHA256SUMS") | .digest')
          test "$published_manifest" = "sha256:$(sha256sum SHA256SUMS | cut -d ' ' -f1)"
